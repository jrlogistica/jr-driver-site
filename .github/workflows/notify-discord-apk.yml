name: Avisar Discord sobre novo APK

on:
  push:
    branches:
      - main
    paths:
      - "*.apk"
      - "**/*.apk"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  anunciar:
    name: Publicar anúncio no Discord
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Identificar o APK a anunciar
        id: apk
        shell: bash
        run: |
          apk_path=""

          if [ "${{ github.event_name }}" = "push" ]; then
            apk_path="$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- "*.apk" "**/*.apk" | tail -n 1)"
          fi

          # Em reenvio manual, anuncia o APK mais recente.
          if [ -z "$apk_path" ]; then
            apk_path="$(find . -type f -name 'J.R-Drive-App-*.apk' -printf '%P\n' | sort -V | tail -n 1)"
          fi

          if [ -z "$apk_path" ] || [ ! -f "$apk_path" ]; then
            echo "::error::Nenhum APK válido foi encontrado para anunciar."
            exit 1
          fi

          apk_file="$(basename "$apk_path")"
          apk_version="${apk_file%.apk}"
          apk_version="${apk_version#J.R-Drive-App-}"

          {
            echo "path=$apk_path"
            echo "file=$apk_file"
            echo "version=$apk_version"
          } >> "$GITHUB_OUTPUT"

      - name: Enviar mensagem para o canal de anúncios
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_FILE: ${{ steps.apk.outputs.file }}
          APK_VERSION: ${{ steps.apk.outputs.version }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::O segredo DISCORD_WEBHOOK_URL ainda não foi configurado no repositório."
            exit 1
          fi

          site_url="https://jrlogistica.github.io/jr-driver-site/"
          apk_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/${APK_PATH}"
          published_at="$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"

          release_notes="Melhorias, correções e evolução contínua do J.R Driver. Confira o histórico completo no site oficial."
          if [ "$APK_VERSION" = "9.7.9-alpha.1" ]; then
            release_notes="• Rotas canceladas no Enterprise são removidas do Driver na sincronização\n• Interface escura revisada e Financeiro padronizado\n• Datas locais e ícones de calendário corrigidos"
          fi

          payload="$(jq -n \
            --arg site_url "$site_url" \
            --arg apk_url "$apk_url" \
            --arg apk_file "$APK_FILE" \
            --arg apk_version "$APK_VERSION" \
            --arg published_at "$published_at" \
            --arg release_notes "$release_notes" \
            '{
              username: "J.R Driver",
              content: "@everyone 🚀 **Nova atualização do J.R Driver disponível!**",
              allowed_mentions: { parse: ["everyone"] },
              embeds: [
                {
                  title: "J.R Driver — nova versão disponível",
                  description: $release_notes,
                  url: $site_url,
                  color: 1298298,
                  fields: [
                    {
                      name: "Versão",
                      value: ("**" + $apk_version + "**"),
                      inline: true
                    },
                    {
                      name: "Arquivo",
                      value: $apk_file,
                      inline: true
                    },
                    {
                      name: "Download",
                      value: ("[Abrir o site oficial](" + $site_url + ") • [Baixar APK diretamente](" + $apk_url + ")"),
                      inline: false
                    }
                  ],
                  footer: {
                    text: "J.R Logística • Programa de testes"
                  },
                  timestamp: $published_at
                }
              ]
            }'
          )"

          if [[ "$DISCORD_WEBHOOK_URL" == *"?"* ]]; then
            webhook_request_url="${DISCORD_WEBHOOK_URL}&wait=true"
          else
            webhook_request_url="${DISCORD_WEBHOOK_URL}?wait=true"
          fi

          response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$webhook_request_url")"

          message_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          channel_id="$(printf '%s' "$response" | jq -r '.channel_id // empty')"

          if [ -z "$message_id" ] || [ -z "$channel_id" ]; then
            echo "::error::O Discord respondeu, mas não confirmou a criação da mensagem."
            printf '%s\n' "$response"
            exit 1
          fi

          echo "Mensagem criada no Discord com sucesso."
          echo "Canal ID: $channel_id"
          echo "Mensagem ID: $message_id"
